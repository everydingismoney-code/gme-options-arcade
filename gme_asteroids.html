<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GME Asteroids — Power to the Players</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#FD0000; --gold:#ffb300; --green:#00c853; --panel:#000; --head:"Oswald","Arial Black",sans-serif; --mono:"Roboto Mono",Consolas,monospace;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#0a0a0a; color:#fff; font-family:var(--mono); min-height:100vh;
    display:flex; flex-direction:column; align-items:center;}
  .topbar{width:100%; display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg,#161616,#000 65%); border-bottom:4px solid var(--red);
    box-shadow:0 4px 18px rgba(0,0,0,.45); margin-bottom:18px;}
  .logo{display:flex; align-items:center; font-family:var(--head); font-weight:700; font-size:1.4rem;
    letter-spacing:.5px; text-transform:uppercase; flex:0 0 auto; white-space:nowrap;
    position:relative; overflow:hidden;}
  .logo .blk{color:#fff; padding:12px 8px 12px 22px;}
  .logo .red{background:var(--red); color:#fff; padding:12px 14px; margin-left:4px;}
  .logo::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg, transparent 32%, color-mix(in srgb, var(--gold) 38%, transparent) 50%, transparent 68%);
    transform:translateX(-130%); animation:sheen 6s ease-in-out infinite;}
  @keyframes sheen{0%,74%{transform:translateX(-130%);} 90%,100%{transform:translateX(130%);}}
  .tag{padding-right:22px; font-family:var(--head); letter-spacing:3px; font-size:.75rem; text-transform:uppercase;
    display:flex; align-items:center; gap:14px;}
  .tag b{color:var(--red); margin-right:6px;}
  #exitBtn{font:inherit; font-size:.7rem; letter-spacing:1.5px; cursor:pointer; color:#fff;
    background:linear-gradient(180deg,#1c1c1c,#000); border:1px solid #444; border-radius:10px;
    padding:7px 13px; transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;}
  #exitBtn:hover{border-color:var(--red); background:linear-gradient(180deg,#2a0000,#120000);
    box-shadow:0 0 16px color-mix(in srgb, var(--red) 45%, transparent);}
  @property --spin{syntax:"<angle>"; inherits:false; initial-value:0deg;}
  .frame{position:relative; border-radius:18px; padding:10px; background:#000;
    box-shadow:0 12px 40px rgba(0,0,0,.6);}
  .frame::before{content:""; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:conic-gradient(from var(--spin), var(--red), var(--gold) 25%, transparent 55%, var(--red));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite:exclude; animation:spinb 9s linear infinite; opacity:.6; pointer-events:none;}
  @keyframes spinb{to{--spin:360deg;}}
  .crt{position:relative; border-radius:12px; overflow:hidden;}
  .crt::after{content:""; position:absolute; inset:0; pointer-events:none; z-index:2;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);}
  .crt::before{content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.4));}
  canvas{display:block; background:#050505; border-radius:12px;}
  .hint{color:#9aa0a6; font-size:.72rem; margin-top:10px; text-align:center; letter-spacing:.5px;}
  .hint b{color:#fff;}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span class="blk">GameStop</span><span class="red">Asteroids</span></div>
  <div class="tag"><b>■</b> Power to the Players
    <button id="exitBtn" title="Back to the calculator (Esc)">✕ EXIT TO CALCULATOR</button>
  </div>
</div>
<div class="frame"><div class="crt"><canvas id="cv" width="900" height="600"></canvas></div></div>
<div class="hint"><b>←→</b> rotate · <b>↑</b> thrust · <b>SPACE</b> shoot · <b>H</b> hyperspace · <b>P</b> pause · <b>M</b> mute · <b>ENTER</b> start · <b>ESC</b> exit</div>
<script>
"use strict";
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const W=cv.width, H=cv.height, TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const wrap=o=>{ if(o.x<-40)o.x+=W+80; if(o.x>W+40)o.x-=W+80; if(o.y<-40)o.y+=H+80; if(o.y>H+40)o.y-=H+80; };
const dist2=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;};

/* ---------- sound (same recipe as the calculator) ---------- */
let audioOn=true, AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(f,dur,type="square",vol=0.04,delay=0,slide=0){
  if(!audioOn) return;
  try{ const c=ac(), o=c.createOscillator(), g=c.createGain(), t=c.currentTime+delay;
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(slide,1),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(_){}}
const SFX={
  laser(){ tone(680,0.09,"square",0.03,0,140); },
  boomBig(){ tone(110,0.35,"sawtooth",0.06,0,40); tone(60,0.4,"triangle",0.06,0.03,25); },
  boomSm(){ tone(220,0.18,"sawtooth",0.045,0,70); },
  coin(){ tone(988,0.08,"square",0.045); tone(1319,0.18,"square",0.045,0.08); },
  powerup(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.09,"square",0.04,i*0.07)); },
  die(){ tone(300,0.2,"sawtooth",0.06,0,60); tone(150,0.4,"sawtooth",0.06,0.15,30); },
  saucer(){ tone(420,0.12,"triangle",0.03,0,520); },
  hyper(){ tone(200,0.25,"sine",0.05,0,1200); },
};

/* ---------- state ---------- */
let state="menu", score=0, lives=3, day=1, hi=0, nextLifeAt=10000;
try{ hi=+localStorage.getItem("gmeAsteroidsHi")||0; }catch(_){}
let ship, bullets, candles, clocks, clouds, saucer, saucerShots, pups, parts, popups;
let shield=0, invuln=0, saucerTimer=0, shake=0, frame=0;

function newShip(){ return {x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2,r:14,cool:0}; }
function reset(){
  score=0; lives=3; day=1; nextLifeAt=10000; startDay(1);
}
function startDay(n){
  day=n; ship=ship||newShip(); ship.x=W/2; ship.y=H/2; ship.vx=ship.vy=0;
  bullets=[]; clocks=[]; clouds=[]; saucer=null; saucerShots=[]; pups=[]; parts=parts||[]; popups=[];
  invuln=120; shield=0; saucerTimer=rnd(600,1100);
  candles=[];
  const nBig=Math.min(3+n,8);
  for(let i=0;i<nBig;i++) candles.push(newCandle(3));
  if(n>=2) for(let i=0;i<Math.min(n-1,4);i++) clocks.push(newClock());
  if(n>=3) for(let i=0;i<Math.min(n-2,3);i++) clouds.push(newCloud());
}
function safeSpot(){ // spawn away from ship
  for(let t=0;t<40;t++){ const x=rnd(0,W), y=rnd(0,H);
    if((x-W/2)**2+(y-H/2)**2>200*200 || !ship) return {x,y}; }
  return {x:0,y:0};
}
function newCandle(sz,at){
  const p=at||safeSpot(), sp=rnd(0.5,1.6)*(4-sz)*0.7+0.4, a=rnd(0,TAU);
  return {x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,sz,r:[0,13,24,40][sz],
    rot:rnd(0,TAU),vr:rnd(-0.02,0.02),body:rnd(0.5,0.75),wick:rnd(0.15,0.3)};
}
function newClock(){
  const p=safeSpot(), a=rnd(0,TAU), sp=rnd(1.6,2.6);
  return {x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:14,t:rnd(0,TAU)};
}
function newCloud(){
  const p=safeSpot(), a=rnd(0,TAU), sp=rnd(0.3,0.7);
  return {x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:34,hp:3,puff:rnd(0,TAU)};
}
function newSaucer(){
  const fromLeft=Math.random()<0.5;
  return {x:fromLeft?-30:W+30, y:rnd(60,H-60), vx:fromLeft?2.2:-2.2, vy:0, r:16, cool:70, wob:rnd(0,TAU)};
}
function boom(x,y,n,col){
  for(let i=0;i<n;i++){ const a=rnd(0,TAU), sp=rnd(0.5,4);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(20,50),col}); }
}
function popup(x,y,txt,col){ popups.push({x,y,txt,col:col||"#fff",life:60}); }
function addScore(n,x,y){
  score+=n; if(x!=null) popup(x,y,"+$"+n,"#00c853");
  if(score>=nextLifeAt){ lives++; nextLifeAt+=10000; popup(ship.x,ship.y-30,"+1 🚀 EXTRA LIFE","#ffb300"); SFX.powerup(); }
}
function maybeDrop(x,y){
  const r=Math.random();
  if(r<0.06) pups.push({x,y,vx:rnd(-0.5,0.5),vy:rnd(-0.5,0.5),kind:"gem",r:13,life:600});
  else if(r<0.16) pups.push({x,y,vx:rnd(-0.5,0.5),vy:rnd(-0.5,0.5),kind:"coin",r:13,life:600});
}

/* ---------- exit ---------- */
function exitGame(){
  // opened in a new tab from the calculator -> close it; otherwise go back / navigate there
  try{ if(window.opener&&!window.opener.closed){ window.close(); return; } }catch(_){}
  if(history.length>1) history.back();
  else location.href="index.html";
  setTimeout(()=>{ try{ window.close(); }catch(_){} },150);
}
document.getElementById("exitBtn").onclick=exitGame;

/* ---------- input ---------- */
const keys={};
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()]=true; keys[e.key]=true;
  if(e.key==="Enter"&&(state==="menu"||state==="over")){ reset(); state="play"; SFX.powerup(); }
  if(e.key.toLowerCase()==="p"&&(state==="play"||state==="pause")) state=state==="play"?"pause":"play";
  if(e.key.toLowerCase()==="m"){ audioOn=!audioOn; }
  if(e.key==="Escape"){ if(state==="play"){ state="pause"; } else { exitGame(); } }
  if(e.key.toLowerCase()==="h"&&state==="play"&&ship){
    ship.x=rnd(40,W-40); ship.y=rnd(40,H-40); ship.vx=ship.vy=0; invuln=Math.max(invuln,40); SFX.hyper();
  }
});
addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; keys[e.key]=false; });

/* ---------- update ---------- */
function update(){
  frame++;
  if(state!=="play") return;
  // ship
  if(keys["arrowleft"]||keys["a"]) ship.a-=0.075;
  if(keys["arrowright"]||keys["d"]) ship.a+=0.075;
  const thrust=keys["arrowup"]||keys["w"];
  if(thrust){ ship.vx+=Math.cos(ship.a)*0.12; ship.vy+=Math.sin(ship.a)*0.12;
    if(frame%3===0) parts.push({x:ship.x-Math.cos(ship.a)*16,y:ship.y-Math.sin(ship.a)*16,
      vx:-Math.cos(ship.a)*2+rnd(-0.5,0.5),vy:-Math.sin(ship.a)*2+rnd(-0.5,0.5),life:18,col:"#ffb300"}); }
  ship.vx*=0.992; ship.vy*=0.992;
  const spd=Math.hypot(ship.vx,ship.vy); if(spd>6){ ship.vx*=6/spd; ship.vy*=6/spd; }
  ship.x+=ship.vx; ship.y+=ship.vy; wrap(ship);
  if(ship.cool>0) ship.cool--;
  if((keys[" "]||keys["spacebar"])&&ship.cool===0){
    bullets.push({x:ship.x+Math.cos(ship.a)*16,y:ship.y+Math.sin(ship.a)*16,
      vx:Math.cos(ship.a)*8+ship.vx*0.4,vy:Math.sin(ship.a)*8+ship.vy*0.4,life:55,r:3});
    ship.cool=11; SFX.laser();
  }
  if(invuln>0) invuln--; if(shield>0) shield--;
  // bullets
  bullets=bullets.filter(b=>{ b.x+=b.vx; b.y+=b.vy; wrap(b); return --b.life>0; });
  saucerShots=saucerShots.filter(b=>{ b.x+=b.vx; b.y+=b.vy; wrap(b); return --b.life>0; });
  // enemies drift
  candles.forEach(c=>{ c.x+=c.vx; c.y+=c.vy; c.rot+=c.vr; wrap(c); });
  clocks.forEach(k=>{ // clocks gently home toward ship — theta always finds you
    const dx=ship.x-k.x, dy=ship.y-k.y, d=Math.hypot(dx,dy)||1;
    k.vx+=dx/d*0.02; k.vy+=dy/d*0.02;
    const s=Math.hypot(k.vx,k.vy); if(s>2.8){ k.vx*=2.8/s; k.vy*=2.8/s; }
    k.x+=k.vx; k.y+=k.vy; k.t+=0.1; wrap(k); });
  clouds.forEach(c=>{ c.x+=c.vx; c.y+=c.vy; c.puff+=0.03; wrap(c); });
  pups=pups.filter(p=>{ p.x+=p.vx; p.y+=p.vy; wrap(p); return --p.life>0; });
  parts=parts.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vx*=0.97; p.vy*=0.97; return --p.life>0; });
  popups=popups.filter(p=>{ p.y-=0.6; return --p.life>0; });
  if(shake>0) shake--;
  // saucer
  if(!saucer&&--saucerTimer<=0&&day>=2){ saucer=newSaucer(); SFX.saucer(); }
  if(saucer){
    saucer.wob+=0.05; saucer.y+=Math.sin(saucer.wob)*0.8; saucer.x+=saucer.vx;
    if(saucer.x<-60||saucer.x>W+60){ saucer=null; saucerTimer=rnd(700,1300); }
    else if(--saucer.cool<=0){ // shoots paper airplanes at you
      const a=Math.atan2(ship.y-saucer.y,ship.x-saucer.x)+rnd(-0.15,0.15);
      saucerShots.push({x:saucer.x,y:saucer.y,vx:Math.cos(a)*3.4,vy:Math.sin(a)*3.4,life:160,r:4});
      saucer.cool=90; SFX.saucer();
    }
  }
  // bullets vs enemies
  bullets=bullets.filter(b=>{
    for(let i=candles.length-1;i>=0;i--){ const c=candles[i];
      if(dist2(b,c)<(c.r+b.r)**2){
        candles.splice(i,1); boom(c.x,c.y,c.sz*8,"#FD0000");
        addScore([0,100,50,20][c.sz],c.x,c.y); maybeDrop(c.x,c.y);
        if(c.sz>1){ candles.push(newCandle(c.sz-1,{x:c.x,y:c.y}),newCandle(c.sz-1,{x:c.x,y:c.y})); }
        c.sz===3?SFX.boomBig():SFX.boomSm(); shake=Math.max(shake,c.sz*2);
        return false; } }
    for(let i=clocks.length-1;i>=0;i--){ const k=clocks[i];
      if(dist2(b,k)<(k.r+b.r)**2){ clocks.splice(i,1); boom(k.x,k.y,10,"#ffb300");
        addScore(150,k.x,k.y); maybeDrop(k.x,k.y); SFX.boomSm(); return false; } }
    for(let i=clouds.length-1;i>=0;i--){ const c=clouds[i];
      if(dist2(b,c)<(c.r+b.r)**2){
        if(--c.hp<=0){ clouds.splice(i,1); boom(c.x,c.y,20,"#b48cff"); addScore(250,c.x,c.y); maybeDrop(c.x,c.y); SFX.boomBig(); }
        else { c.r*=0.85; boom(b.x,b.y,4,"#b48cff"); SFX.boomSm(); }
        return false; } }
    if(saucer&&dist2(b,saucer)<(saucer.r+b.r)**2){
      boom(saucer.x,saucer.y,18,"#9aa0a6"); addScore(500,saucer.x,saucer.y);
      popup(saucer.x,saucer.y-20,"SHORT SQUEEZED","#ffb300");
      saucer=null; saucerTimer=rnd(800,1400); SFX.boomBig(); return false; }
    return true;
  });
  // powerup pickup
  pups=pups.filter(p=>{
    if(dist2(p,ship)<(p.r+ship.r)**2){
      if(p.kind==="coin"){ addScore(500,p.x,p.y); SFX.coin(); }
      else { shield=420; popup(p.x,p.y,"💎 DIAMOND HANDS","#7fe7ff"); SFX.powerup(); }
      return false; }
    return true;
  });
  // ship hit
  if(invuln<=0&&shield<=0){
    const hitBy=o=>o&&dist2(o,ship)<(o.r+ship.r-3)**2;
    let hit=candles.some(hitBy)||clocks.some(hitBy)||clouds.some(hitBy)||hitBy(saucer)||saucerShots.some(hitBy);
    if(hit){
      lives--; boom(ship.x,ship.y,30,"#FD0000"); SFX.die(); shake=14;
      popup(ship.x,ship.y-24,"PAPER HANDED","#FD0000");
      if(lives<=0){ state="over";
        if(score>hi){ hi=score; try{ localStorage.setItem("gmeAsteroidsHi",String(hi)); }catch(_){}}
      } else { ship.x=W/2; ship.y=H/2; ship.vx=ship.vy=0; invuln=150; }
    }
  } else if(shield>0){ // shield bounces enemies' shots
    saucerShots=saucerShots.filter(b=>dist2(b,ship)>=(b.r+ship.r+6)**2);
  }
  // day cleared
  if(candles.length===0&&clocks.length===0&&clouds.length===0&&!saucer){
    popup(W/2,H/2-40,"DAY "+day+" CLEARED — MARKET CLOSED","#00c853");
    addScore(1000*day,null); startDay(day+1); SFX.powerup();
  }
}

/* ---------- draw ---------- */
const stars=Array.from({length:90},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(0.4,1.6),tw:rnd(0,TAU)}));
function drawCandle(c){
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
  const h=c.r*2, bw=c.r*0.9, bh=h*c.body, wick=h*c.wick;
  ctx.strokeStyle="#ff6659"; ctx.lineWidth=Math.max(2,c.r*0.12);
  ctx.beginPath(); ctx.moveTo(0,-bh/2-wick); ctx.lineTo(0,bh/2+wick); ctx.stroke();
  const g=ctx.createLinearGradient(-bw/2,0,bw/2,0);
  g.addColorStop(0,"#a30000"); g.addColorStop(0.5,"#FD0000"); g.addColorStop(1,"#7a0000");
  ctx.fillStyle=g; ctx.fillRect(-bw/2,-bh/2,bw,bh);
  ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.lineWidth=1; ctx.strokeRect(-bw/2,-bh/2,bw,bh);
  ctx.restore();
}
function emoji(x,y,s,e,rot){ ctx.save(); ctx.translate(x,y); if(rot)ctx.rotate(rot);
  ctx.font=s+"px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(e,0,0); ctx.restore(); }
function draw(){
  ctx.save();
  if(shake>0) ctx.translate(rnd(-shake,shake)*0.5,rnd(-shake,shake)*0.5);
  ctx.clearRect(-20,-20,W+40,H+40);
  // stars
  stars.forEach(s=>{ ctx.globalAlpha=0.4+0.4*Math.sin(s.tw+frame*0.02);
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill(); });
  ctx.globalAlpha=1;
  if(state==="menu"){ drawMenu(); ctx.restore(); return; }
  // entities
  candles.forEach(drawCandle);
  clocks.forEach(k=>emoji(k.x,k.y,26,"⏰",Math.sin(k.t)*0.4));
  clouds.forEach(c=>{ ctx.globalAlpha=0.9; emoji(c.x,c.y,c.r*2,"🌩️",Math.sin(c.puff)*0.1); ctx.globalAlpha=1;
    ctx.fillStyle="#b48cff"; ctx.font="bold 11px Consolas,monospace";
    ctx.textAlign="center"; ctx.fillText("IV",c.x,c.y+c.r+12); });
  if(saucer) emoji(saucer.x,saucer.y,34,"🛸",Math.sin(saucer.wob)*0.15);
  saucerShots.forEach(b=>emoji(b.x,b.y,16,"🧻"));
  pups.forEach(p=>{ if(p.life<120&&p.life%20<10) return; emoji(p.x,p.y,24,p.kind==="coin"?"🪙":"💎"); });
  bullets.forEach(b=>{ ctx.fillStyle="#ffb300"; ctx.shadowColor="#ffb300"; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); ctx.shadowBlur=0; });
  parts.forEach(p=>{ ctx.globalAlpha=Math.min(1,p.life/25); ctx.fillStyle=p.col;
    ctx.fillRect(p.x-1.5,p.y-1.5,3,3); ctx.globalAlpha=1; });
  // ship
  if(state!=="over"&&(invuln<=0||frame%10<6)){
    if(shield>0){ ctx.strokeStyle="rgba(127,231,255,"+(shield<90?(frame%10<5?0.9:0.2):0.7)+")";
      ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ship.x,ship.y,ship.r+9,0,TAU); ctx.stroke(); }
    emoji(ship.x,ship.y,30,"🚀",ship.a+Math.PI/4); // glyph points NE; +45° aligns it with heading
  }
  popups.forEach(p=>{ ctx.globalAlpha=Math.min(1,p.life/30); ctx.fillStyle=p.col;
    ctx.font="bold 14px Consolas,monospace"; ctx.textAlign="center"; ctx.fillText(p.txt,p.x,p.y); ctx.globalAlpha=1; });
  drawHUD();
  if(state==="pause"){ overlayText("PAUSED","press P to resume · ESC to exit to the calculator"); }
  if(state==="over"){ drawOver(); }
  ctx.restore();
}
function drawHUD(){
  ctx.textAlign="left"; ctx.fillStyle="#00c853"; ctx.font="bold 20px Consolas,monospace";
  ctx.fillText("P/L  $"+score.toLocaleString(),16,28);
  ctx.fillStyle="#9aa0a6"; ctx.font="12px Consolas,monospace";
  ctx.fillText("HI $"+Math.max(hi,score).toLocaleString(),16,46);
  ctx.textAlign="center"; ctx.fillStyle="#fff"; ctx.font="bold 15px Oswald,sans-serif";
  ctx.fillText("TRADING DAY "+day,W/2,26);
  ctx.textAlign="right"; ctx.font="16px serif";
  for(let i=0;i<lives;i++) ctx.fillText("🚀",W-14-i*22,26);
  if(shield>0){ ctx.fillStyle="#7fe7ff"; ctx.font="11px Consolas,monospace";
    ctx.fillText("💎 "+Math.ceil(shield/60)+"s",W-14,46); }
}
function overlayText(a,b){
  ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center"; ctx.fillStyle="#fff"; ctx.font="bold 44px Oswald,sans-serif";
  ctx.fillText(a,W/2,H/2-10);
  ctx.fillStyle="#9aa0a6"; ctx.font="14px Consolas,monospace"; ctx.fillText(b,W/2,H/2+24);
}
function verdict(){
  if(score>=20000) return ["HEALTHY · TO THE MOON 🌕","#00c853"];
  if(score>=10000) return ["STRUGGLING · HODL HARDER","#ffb300"];
  if(score>=5000)  return ["CRITICAL · THETA GANG GOT YOU","#e8843a"];
  return ["DEAD ON ARRIVAL · 0/100","#FD0000"];
}
function drawOver(){
  ctx.fillStyle="rgba(0,0,0,.65)"; ctx.fillRect(0,0,W,H);
  const [v,col]=verdict();
  ctx.textAlign="center";
  ctx.fillStyle="#fff"; ctx.font="bold 46px Oswald,sans-serif"; ctx.fillText("MARGIN CALLED",W/2,H/2-70);
  ctx.fillStyle=col; ctx.font="bold 22px Oswald,sans-serif"; ctx.fillText(v,W/2,H/2-30);
  ctx.fillStyle="#00c853"; ctx.font="bold 26px Consolas,monospace"; ctx.fillText("FINAL P/L  $"+score.toLocaleString(),W/2,H/2+14);
  ctx.fillStyle="#ffb300"; ctx.font="15px Consolas,monospace";
  ctx.fillText(score>=hi&&score>0?"★ NEW ALL-TIME HIGH ★":"ALL-TIME HIGH  $"+hi.toLocaleString(),W/2,H/2+44);
  ctx.fillStyle="#9aa0a6"; ctx.font="14px Consolas,monospace"; ctx.fillText("press ENTER to average down (play again)",W/2,H/2+80);
  ctx.fillStyle="#6b6b6b"; ctx.font="12px Consolas,monospace"; ctx.fillText("press ESC to exit to the calculator",W/2,H/2+104);
}
function drawMenu(){
  ctx.textAlign="center";
  emoji(W/2,H/2-130,64,"🚀",-Math.PI/4);
  ctx.fillStyle="#fff"; ctx.font="bold 54px Oswald,sans-serif"; ctx.fillText("GME ASTEROIDS",W/2,H/2-40);
  ctx.fillStyle="#FD0000"; ctx.font="bold 16px Oswald,sans-serif"; ctx.letterSpacing="4px";
  ctx.fillText("POWER TO THE PLAYERS",W/2,H/2-12); ctx.letterSpacing="0px";
  ctx.fillStyle="#9aa0a6"; ctx.font="13px Consolas,monospace";
  ctx.fillText("Shoot the red candles before they wreck your account.",W/2,H/2+26);
  ctx.fillText("⏰ theta clocks hunt you · 🌩️ IV clouds soak 3 hits · 🛸 short sellers throw 🧻",W/2,H/2+46);
  ctx.fillText("🪙 = +$500 · 💎 = diamond-hands shield · extra 🚀 every $10,000",W/2,H/2+66);
  ctx.fillStyle="#ffb300"; ctx.font="bold 18px Oswald,sans-serif";
  if(frame%60<40) ctx.fillText("PRESS ENTER TO START",W/2,H/2+110);
  ctx.fillStyle="#9aa0a6"; ctx.font="12px Consolas,monospace";
  ctx.fillText("ALL-TIME HIGH  $"+hi.toLocaleString(),W/2,H/2+140);
}
(function loop(){ update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
